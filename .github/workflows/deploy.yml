name: Build and Deploy echo-bot

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Используем дефис для имени образа в Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/echo-bot:${{ github.sha }}

      - name: Update GitOps Repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://$DOCKER_USERNAME:$GITOPS_TOKEN@github.com/goncharukinna/bots-gitops.git
          cd bots-gitops
          # Меняем путь на папку echo-bot (через дефис, как в манифестах)
          sed -i "s|image: .*echo-bot:.*|image: $DOCKER_USERNAME/echo-bot:$IMAGE_TAG|" manifests/echo-bot/deployment.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add manifests/echo-bot/deployment.yaml
          git commit -m "ci: update echo-bot image tag to $IMAGE_TAG [skip ci]"
          git push origin main
